# Global defaults that apply to every scrape job unless a job overrides them.
global:
  scrape_interval: 5s      # how often Prometheus pulls /metrics from each target
  evaluation_interval: 5s  # how often it evaluates alerting/recording rules (none yet)

# The list of things to scrape. Each "job" is one logical service.
scrape_configs:
  - job_name: "api_gateway"        # label attached to every metric from this job
    metrics_path: "/metrics"       # the path to hit (this is actually the default)
    static_configs:                # targets listed by hand (vs. auto-discovery)
      - targets: ["gateway:8000"]
        # "gateway" = the Compose service name. Prometheus and the gateway are
        # both containers on the same Compose network, so Prometheus reaches the
        # gateway directly by service name — no host.docker.internal hop needed.
